name: Build packages

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  flatpak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Flatpak builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
      - name: Install Flatpak SDKs
        run: |
          flatpak install --user --noninteractive -y flathub \
            org.kde.Platform//6.10 \
            org.kde.Sdk//6.10 \
            io.qt.PySide.BaseApp//6.10
      - name: Build Flatpak bundle
        run: |
          flatpak-builder --user --force-clean --repo=flatpak-repo build-dir ua.nkr.GCS.yml
          flatpak build-bundle flatpak-repo nkr-gcs.flatpak ua.nkr.GCS
      - uses: actions/upload-artifact@v4
        with:
          name: nkr-gcs-linux-flatpak
          path: nkr-gcs.flatpak

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - shell: pwsh
        run: ./packaging/windows/build.ps1
      - name: Smoke-test Windows executable
        shell: pwsh
        run: |
          $process = Start-Process ".\dist\nkr-gcs\nkr-gcs.exe" -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) {
            throw "nkr-gcs.exe exited during startup with code $($process.ExitCode)"
          }
          Stop-Process -Id $process.Id -Force
      - uses: actions/upload-artifact@v4
        with:
          name: nkr-gcs-windows-x64
          path: dist/nkr-gcs

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [flatpak, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: nkr-gcs-linux-flatpak
          path: release/linux
      - uses: actions/download-artifact@v4
        with:
          name: nkr-gcs-windows-x64
          path: release/windows/nkr-gcs
      - name: Prepare release files
        run: |
          mv release/linux/nkr-gcs.flatpak release/nkr-gcs-linux-x86_64.flatpak
          cd release/windows
          zip -r ../nkr-gcs-windows-x64.zip nkr-gcs
          cd ..
          sha256sum nkr-gcs-linux-x86_64.flatpak nkr-gcs-windows-x64.zip > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "NKR GCS $GITHUB_REF_NAME" \
            --notes-file "packaging/release-notes-v${VERSION}.md" \
            release/nkr-gcs-linux-x86_64.flatpak \
            release/nkr-gcs-windows-x64.zip \
            release/SHA256SUMS.txt
