name: Build packages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  flatpak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Flatpak builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
      - name: Install Flatpak SDKs
        run: |
          flatpak install --user --noninteractive -y flathub \
            org.kde.Platform//6.10 \
            org.kde.Sdk//6.10 \
            io.qt.PySide.BaseApp//6.10
      - name: Build Flatpak bundle
        run: |
          flatpak-builder --user --force-clean --repo=flatpak-repo build-dir ua.nkr.GCS.yml
          flatpak build-bundle flatpak-repo nkr-gcs.flatpak ua.nkr.GCS
      - uses: actions/upload-artifact@v4
        with:
          name: nkr-gcs-linux-flatpak
          path: nkr-gcs.flatpak

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - shell: pwsh
        run: ./packaging/windows/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: nkr-gcs-windows-x64
          path: dist/nkr-gcs
