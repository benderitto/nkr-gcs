name: Build packages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  flatpak:
    runs-on: ubuntu-latest
    container:
      image: bilelmoussaoui/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: nkr-gcs.flatpak
          manifest-path: ua.nkr.GCS.yml
          cache-key: flatpak-builder-${{ github.sha }}

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - shell: pwsh
        run: ./packaging/windows/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: nkr-gcs-windows-x64
          path: dist/nkr-gcs
